<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular Headset Arch -->
  <path d="M 24 50 A 26 26 0 0 1 76 50" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Left Ear Cushion -->
  <rect x="18" y="42" width="7" height="18" rx="3.5" fill="#DC2626" />
  <!-- Right Ear Cushion -->
  <rect x="75" y="42" width="7" height="18" rx="3.5" fill="#DC2626" />

  <!-- Microphone Boom -->
  <path d="M 75 56 C 75 73 58 75 51 75" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="48" cy="75" r="3.5" fill="#D97706" />

  <!-- Speech Bubble in Center -->
  <path d="M 34 33 C 34 26 66 26 66 33 C 66 43 54 48 45 49 L 37 54 L 39 48 C 35 46 34 41 34 33 Z" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Text lines inside speech bubble -->
  <line x1="42" y1="33" x2="58" y2="33" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="38" x2="60" y2="38" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
  <line x1="43" y1="43" x2="56" y2="43" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" />
</svg>
